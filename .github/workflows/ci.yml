# CI SIRA — roadmap Phase 0.1 et critere d'acceptation « CI verte ».
#
# Trois travaux independants, du plus rapide au plus lent, pour que l'echec
# arrive tot. Aucun service externe payant, aucun secret : la CI doit rester
# executable par n'importe quel contributeur sur son fork.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Une seule execution par branche : les pushes successifs annulent la
# precedente plutot que d'empiler des minutes de runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # Aucune telemetrie sortante depuis la CI.
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  # --- 1. Chaine qualite TypeScript -----------------------------------------
  qualite:
    name: Lint, types et tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4

      - name: Installer Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # --frozen-lockfile : un pnpm-lock.yaml non a jour doit faire echouer la
      # CI, pas etre corrige silencieusement.
      - name: Installer les dependances
        run: pnpm install --frozen-lockfile

      - name: Format (Prettier)
        run: pnpm format:check

      # D abord, car tout ce qui suit en depend : ESLint est type-aware et les
      # paquets partages ne se typent que via leur dist. C est aussi le seul
      # chemin qui exerce ce que fait le binaire de production — un require()
      # sur la sortie compilee, la ou Vitest resout vers les sources.
      - name: Build
        run: pnpm build

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Types (tsc --noEmit)
        run: pnpm typecheck

      - name: Tests (Vitest)
        run: pnpm test

  # --- 2. Jeu de donnees Abidjan --------------------------------------------
  donnees:
    name: Jeu de donnees Abidjan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # data/abidjan-stops.json est un artefact genere : il doit etre
      # exactement la sortie du script, sinon les benchmarks de la Phase 2 ne
      # seraient pas reproductibles.
      - name: Le JSON commite est bien la sortie du generateur
        run: bash data/check-generated.sh

      - name: Valider contre le JSON Schema
        run: |
          python -m pip install --quiet check-jsonschema
          check-jsonschema --schemafile data/abidjan-stops.schema.json \
            data/abidjan-stops.json

  # --- 3. Infrastructure locale ---------------------------------------------
  infra:
    name: Scripts et docker-compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck sur les scripts d infra et de donnees
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --quiet shellcheck
          shellcheck --severity=warning \
            infra/compose.sh \
            infra/smoke-test.sh \
            infra/osrm/prepare.sh \
            infra/osrm/verify-pipeline.sh \
            infra/osrm/run-synthetic.sh \
            infra/photon/prepare.sh \
            infra/check-env-example.sh \
            apps/api/scripts/smoke.sh \
            data/check-generated.sh

      # Ne demarre rien (les images OSRM/Photon exigent des donnees preparees
      # de plusieurs Go) : verifie seulement que le fichier est valide et que
      # toutes les variables interpolees ont un defaut.
      - name: Valider docker-compose.yml
        run: docker compose -f infra/docker-compose.yml config --quiet

      - name: Le .env.example couvre toutes les variables du compose
        run: bash infra/check-env-example.sh

  # --- 4. Solveur VRP (Python) -----------------------------------------------
  vrp:
    name: Solveur VRP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/vrp-solver

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances
        run: pip install -e ".[dev]"

      - name: Lint et format (ruff)
        run: |
          ruff check .
          ruff format --check .

      # Inclut les deux criteres d acceptation de la Phase 2 : ecart a la
      # solution publiee de C101, et 3 vehicules x 45 arrets d Abidjan en
      # moins de 15 s.
      - name: Tests (pytest)
        run: pytest -q

  # --- 5. API compilee, sur une vraie base -----------------------------------
  api:
    name: API compilee
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: sira
          POSTGRES_PASSWORD: sira
          POSTGRES_DB: sira
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sira -d sira"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://sira:sira@localhost:5432/sira?schema=public
      # Valeurs de test : aucune n ouvre quoi que ce soit, la base est jetable.
      JWT_ACCESS_SECRET: secret-de-ci-sans-valeur
      JWT_REFRESH_SECRET: autre-secret-de-ci
      # 127.0.0.1 et non localhost : undici n a pas de repli IPv4.
      OSRM_URL: http://127.0.0.1:5000
      VRP_SOLVER_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4

      - name: Installer Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Installer les dependances
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Les migrations creent elles-memes postgis, pg_trgm et unaccent :
      # l image de service n execute pas infra/postgres/init.
      - name: Appliquer les migrations
        run: pnpm --filter @sira/api exec prisma migrate deploy

      # OSRM et le solveur VRP doivent tourner pour de vrai : les tests
      # d orchestration verifient precisement la chaine complete, et sans eux
      # ils seraient ignores — le chemin le plus complexe de la Phase 2 ne
      # serait jamais exerce en CI. L extrait synthetique suffit : 19 lignes,
      # aucun telechargement.
      - name: Demarrer OSRM sur l extrait synthetique
        run: |
          work="$(mktemp -d)"
          cp infra/osrm/smoke-synthetic.osm "$work/"
          image=osrm/osrm-backend:v5.25.0
          docker run --rm -v "$work:/data" "$image" \
            osrm-extract -p /opt/car.lua /data/smoke-synthetic.osm
          docker run --rm -v "$work:/data" "$image" osrm-partition /data/smoke-synthetic.osrm
          docker run --rm -v "$work:/data" "$image" osrm-customize /data/smoke-synthetic.osrm
          docker run -d --name sira-osrm-ci -p 5000:5000 -v "$work:/data:ro" "$image" \
            osrm-routed --algorithm mld --max-table-size 200 /data/smoke-synthetic.osrm
          for _ in $(seq 1 30); do
            curl -fsS --max-time 2 \
              "http://127.0.0.1:5000/route/v1/driving/-4.0212,5.3251;-3.9958,5.3457" \
              >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "OSRM n a pas demarre" >&2
          docker logs sira-osrm-ci >&2
          exit 1

      - name: Installer Python pour le solveur VRP
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Demarrer le solveur VRP
        run: |
          pip install --quiet -e ./services/vrp-solver
          (cd services/vrp-solver && nohup python -m uvicorn app.main:app \
            --host 127.0.0.1 --port 8000 > /tmp/vrp.log 2>&1 &)
          for _ in $(seq 1 30); do
            curl -fsS --max-time 2 http://127.0.0.1:8000/health >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Le solveur VRP n a pas demarre" >&2
          cat /tmp/vrp.log >&2
          exit 1

      # Unitaires et bout en bout dans la meme passe, avec le seuil de
      # couverture de la Phase 1 : >= 70 % sur les services. Les deux sont
      # indissociables — un service NestJS n est presque jamais exerce par un
      # test unitaire seul, et mesurer sans les e2e donnerait un chiffre qui ne
      # dit rien de ce qui est reellement teste.
      - name: Tests et couverture (seuil 70 % sur les services)
        run: pnpm --filter @sira/api test:cov

      - name: Demarrer l API compilee et l interroger
        run: bash apps/api/scripts/smoke.sh
