# SIRA — environnement local reproductible (roadmap Phase 0.3).
# Depuis la racine du repo :  pnpm infra:up   (ou docker compose -f infra/docker-compose.yml up -d)
#
# Prealable, une seule fois avant le premier demarrage :
#   bash infra/osrm/prepare.sh      # extrait OSM Cote d'Ivoire + pipeline MLD
#   bash infra/photon/prepare.sh    # jar Photon + index de geocodage Cote d'Ivoire
#
# Les images sont epinglees : toute mise a jour doit etre un commit explicite.

name: sira

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sira-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sira}
      POSTGRES_DB: ${POSTGRES_DB:-sira}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sira} -d ${POSTGRES_DB:-sira}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Routage : pipeline MLD (et non CH) — requis pour reinjecter les vitesses
  # trafic via osrm-customize en Phase 5, sans re-traiter tout l'extrait.
  osrm:
    image: osrm/osrm-backend:v5.27.1
    container_name: sira-osrm
    restart: unless-stopped
    command: >
      osrm-routed --algorithm mld --max-table-size 200
      /data/${OSM_EXTRACT_NAME:-ivory-coast-latest}.osrm
    ports:
      - "${OSRM_PORT:-5000}:5000"
    volumes:
      - ./osrm/data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", 'timeout 3 bash -c "</dev/tcp/localhost/5000" || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Geocodage : Photon lance depuis le jar officiel sur une JRE standard,
  # plutot que depuis une image communautaire non auditee.
  photon:
    image: eclipse-temurin:21-jre
    container_name: sira-photon
    restart: unless-stopped
    working_dir: /photon
    command: >
      java -Xmx2g -jar /photon/photon.jar
      -data-dir /photon
      -listen-ip 0.0.0.0
      -listen-port 2322
      -cors-any
    ports:
      - "${PHOTON_PORT:-2322}:2322"
    volumes:
      - ./photon:/photon
    healthcheck:
      test: ["CMD-SHELL", 'timeout 3 bash -c "</dev/tcp/localhost/2322" || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

volumes:
  postgres-data:
